{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopkeeper Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            max-width: 700px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            font-size: 1rem;
            color: #007bff;
            transition: 0.3s;
        }
        a:hover {
            color: #0056b3;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    {% if messages %}
        <script>
            alert("{{ messages|escapejs }}");
        </script>
    {% endif %}

    <div class="container">
        <h1>Shopkeeper Registration</h1>
        <form action="" enctype="multipart/form-data" method="POST">
            {% csrf_token %}
            <input type="text" placeholder="Owner name" name="ownername" required><br>
            <input type="text" placeholder="Shop name" name="shopname" required><br>
            <input type="text" placeholder="Shop type" name="shoptype" required><br>
            <input type="file" name="shopowner" required><br>
            <input type="file" name="shopimage" required><br>
            <label>Shop Location:</label><br>
            <input type="text" placeholder="District" name="district" required><br>
            <input type="text" placeholder="Mandal" name="mandal" required><br>
            <input type="text" placeholder="Village" name="village" required><br>
            <input type="text" placeholder="Area" name="area" required><br>
            <input type="number" placeholder="Mobile" name="number" required><br>
            <input type="email" placeholder="Email" name="email" required><br>
            <input type="password" placeholder="Password" name="password" required><br>
            <input type="submit" value="Submit"><br>
            <a href="{% url 'reopenshop' %}">Reopen shop</a>
        </form>
    </div>
</body>
</html>
