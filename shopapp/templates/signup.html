{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #4A56E2,
                #5F6FFF
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            position: relative;
            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND CIRCLES
        ===================================================== */

        body::before,
        body::after {
            content: "";

            position: absolute;

            width: 500px;
            height: 500px;

            background: rgba(255, 255, 255, 0.08);

            border-radius: 50%;

            z-index: 0;
        }

        body::before {
            top: -200px;
            left: -200px;
        }

        body::after {
            bottom: -200px;
            right: -200px;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 500px;

            padding: 40px 30px;

            background: rgba(255, 255, 255, 0.06);

            border-radius: 28px;

            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.25);

            text-align: center;

            animation: float 6s ease-in-out infinite;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        h1 {
            color: #FFD86B;

            font-size: 2rem;
            font-weight: 800;

            margin-bottom: 25px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        form {
            width: 100%;
        }


        /* =====================================================
           INPUTS
        ===================================================== */

        input[type="text"],
        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 14px 12px;

            margin: 10px 0;

            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.3);

            background: rgba(255, 255, 255, 0.15);

            color: #fff;

            font-size: 1rem;

            transition:
                border 0.3s,
                box-shadow 0.3s;
        }


        /* =====================================================
           PLACEHOLDER
        ===================================================== */

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }


        /* =====================================================
           INPUT FOCUS
        ===================================================== */

        input:focus {
            outline: none;

            border-color: #FFD86B;

            box-shadow:
                0 0 0 2px rgba(255, 216, 107, 0.3);
        }


        /* =====================================================
           LOCATION LABEL
        ===================================================== */

        label {
            display: block;

            text-align: left;

            color: #FFD86B;

            margin-top: 15px;
            margin-bottom: 5px;

            font-weight: 600;
        }


        /* =====================================================
           LOCATION GRID
        ===================================================== */

        .location-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .location-grid input {
            margin: 0;
        }


        /* =====================================================
           MAP
        ===================================================== */

        #map {

            width: 100%;
            height: 250px;

            margin-top: 18px;

            border-radius: 15px;

            overflow: hidden;

            border: 2px solid rgba(255, 255, 255, 0.25);
        }


        /* =====================================================
           CURRENT LOCATION BUTTON
        ===================================================== */

        #currentLocation {

            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.18);

            color: #fff;

            font-size: 0.95rem;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        #currentLocation:hover {

            background: rgba(255, 255, 255, 0.28);

            transform: translateY(-2px);
        }


        /* =====================================================
           SUBMIT BUTTON
        ===================================================== */

        input[type="submit"] {

            width: 100%;

            padding: 14px;

            margin-top: 20px;

            border: none;

            border-radius: 999px;

            background: #FFD86B;

            color: #4A56E2;

            font-weight: 700;

            font-size: 1rem;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        input[type="submit"]:hover {

            transform: translateY(-3px);

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           SCROLL BUTTON
        ===================================================== */

        #scrollDownBtn {

            display: none;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer-text {

            margin-top: 20px;

            font-size: 14px;

            color: #FFD86B;
        }


        .footer-link {

            display: inline-block;

            margin-top: 5px;

            font-size: 14px;

            color: #FFD86B;

            text-decoration: none;

            font-weight: 600;
        }


        .footer-link:hover {

            text-decoration: underline;
        }


        /* =====================================================
           FLOAT ANIMATION
        ===================================================== */

        @keyframes float {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }


        /* =====================================================
           RESPONSIVE DESIGN
        ===================================================== */

        @media (max-width: 520px) {

            body {
                padding: 15px;
                align-items: flex-start;
            }

            .container {

                margin-top: 20px;

                padding: 30px 20px;

                border-radius: 22px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .location-grid {

                grid-template-columns: 1fr;
            }

            #map {
                height: 220px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CONTAINER
    ====================================================== -->

    <div class="container">


        <!-- =================================================
             DJANGO MESSAGES
        ================================================== -->

        {% for message in messages %}

            <script>
                alert("{{ message|escapejs }}");
            </script>

        {% endfor %}


        <!-- =================================================
             PAGE HEADING
        ================================================== -->

        <h1>Signup</h1>


        <!-- =================================================
             SIGNUP FORM
        ================================================== -->

        <form method="POST">

            {% csrf_token %}


            <!-- Username -->

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >


            <!-- Email -->

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >


            <!-- Password -->

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >


            <!-- =================================================
                 LOCATION
            ================================================== -->

            <label>Location</label>


            <div class="location-grid">


                <!-- District -->

                <input
                    type="text"
                    name="district"
                    placeholder="District"
                    required
                >


                <!-- Mandal -->

                <input
                    type="text"
                    name="mandal"
                    placeholder="Mandal"
                    required
                >


                <!-- Village -->

                <input
                    type="text"
                    name="village"
                    placeholder="Village"
                    required
                >


                <!-- Area -->

                <input
                    type="text"
                    name="area"
                    placeholder="Area"
                    required
                >


                <!-- Nearby -->

                <input
                    type="text"
                    name="near_by"
                    placeholder="Near details"
                    required
                >


                <!-- House Number -->

                <input
                    type="text"
                    name="h_no"
                    placeholder="H.No"
                    required
                >

            </div>


            <!-- =================================================
                 GOOGLE MAP
            ================================================== -->

            <div id="map"></div>


            <!-- =================================================
                 HIDDEN LOCATION VALUES
            ================================================== -->

            <input
                type="hidden"
                name="latitude"
                id="latitude"
            >

            <input
                type="hidden"
                name="longitude"
                id="longitude"
            >


            <!-- =================================================
                 CURRENT LOCATION BUTTON
            ================================================== -->

            <button
                type="button"
                id="currentLocation"
            >
                📍 Use My Current Location
            </button>


            <!-- =================================================
                 SUBMIT
            ================================================== -->

            <input
                type="submit"
                value="Submit"
            >

        </form>


        <!-- =================================================
             SIGN IN
        ================================================== -->

        <p class="footer-text">
            Already have an account?
        </p>

        <a
            href="{% url 'signin' %}"
            class="footer-link"
        >
            Sign in
        </a>


    </div>


    <!-- =====================================================
         GOOGLE MAP JAVASCRIPT
    ====================================================== -->

    <script>

        let map;
        let marker;


        /* =====================================================
           INITIALIZE GOOGLE MAP
        ====================================================== */

        function initMap() {

            const defaultLocation = {
                lat: 17.3850,
                lng: 78.4867
            };


            /* Create Map */

            map = new google.maps.Map(
                document.getElementById("map"),
                {
                    center: defaultLocation,
                    zoom: 14
                }
            );


            /* Create Marker */

            marker = new google.maps.Marker({

                position: defaultLocation,

                map: map,

                draggable: true

            });


            /* Set Default Location */

            updateLocation(defaultLocation);


            /* =================================================
               WHEN MARKER IS DRAGGED
            ================================================== */

            marker.addListener(
                "dragend",
                function () {

                    const position = marker.getPosition();

                    const location = {

                        lat: position.lat(),

                        lng: position.lng()

                    };

                    updateLocation(location);

                }
            );

        }


        /* =====================================================
           UPDATE LATITUDE AND LONGITUDE
        ====================================================== */

        function updateLocation(location) {

            document.getElementById("latitude").value =
                location.lat;

            document.getElementById("longitude").value =
                location.lng;

        }


        /* =====================================================
           GET CURRENT LOCATION
        ====================================================== */

        function getCurrentLocation() {


            /* Check browser support */

            if (!navigator.geolocation) {

                alert(
                    "Location is not supported by your browser."
                );

                return;
            }


            /* Get GPS position */

            navigator.geolocation.getCurrentPosition(

                function (position) {


                    const location = {

                        lat: position.coords.latitude,

                        lng: position.coords.longitude

                    };


                    /* Move map */

                    map.setCenter(location);

                    map.setZoom(17);


                    /* Move marker */

                    marker.setPosition(location);


                    /* Update hidden fields */

                    updateLocation(location);

                },


                function () {

                    alert(
                        "Unable to get your location. Please allow location permission."
                    );

                }

            );

        }


        /* =====================================================
           CURRENT LOCATION BUTTON EVENT
        ====================================================== */

        document
            .getElementById("currentLocation")
            .addEventListener(
                "click",
                getCurrentLocation
            );

    </script>

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCcrAGSdXCf4rQPiySLL7bT4RVcGP84XsU&libraries=places&callback=initMap"
        async
        defer>
    </script>
</body>
</html>
